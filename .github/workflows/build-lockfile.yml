name: Build trusted dependency lockfile

on:
  push:
    paths:
      - 'bootstrap/package.json'
      - '.github/workflows/build-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate exact lockfile
        working-directory: bootstrap
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify reproducible install from lockfile
        working-directory: bootstrap
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked production graph
        working-directory: bootstrap
        run: npm audit --omit=dev --audit-level=high
      - name: Publish lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: site03-trusted-package-lock
          path: bootstrap/package-lock.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit lockfile if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile unchanged.'
          else
            git commit -m 'Generate trusted bootstrap package-lock'
            git push
          fi
